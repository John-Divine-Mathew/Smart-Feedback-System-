<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Smart Feedback System Login
       

    </title>

    <link rel="stylesheet"
    href="css/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <img
                src="assets/hirotec-logo.webp"
                class="logo"    
                alt="HIROTEC Logo"
            >

            <h1>

            Smart Feedback System 

            </h1>

            <p>


            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

                <button type="submit">

                    Login

                </button>

            </form>

            <div id="errorMessage">

                Invalid Email or Password

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
